server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:exam;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-test.sql

app:
  jwt:
    secret: ThisIsASecretKeyForJwtSigningMeetingRoomReservationSystem2026!
    expiration-seconds: 28800
  auth:
    max-failed-attempts: 5
    lockout-minutes: 15
    ip-max-failed-attempts: 10
    ip-rate-limit-minutes: 10
  reservation:
    submit-lock-seconds: 5
  dashboard:
    cache-ttl-minutes: 10
